<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat with Bright Smile Dental Clinic</title>
<meta name="description" content="Ask a question or request an appointment with Bright Smile Dental Clinic.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230e7c86'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='white'%3E✦%3C/text%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#f2f4f7}
  #chat{max-width:760px;margin:0 auto;height:100vh;height:100dvh;padding:16px}
  @media (max-width:600px){#chat{padding:0}}
</style>
</head>
<body>
<div id="chat"></div>
<script src="../chatbot.min.js?v=4" data-manual></script>
<script src="../clinic-config.js?v=4"></script>
<script>
  // chat.html?mode=standard  shows the Standard version (no AI)
  var cfg = JSON.parse(JSON.stringify(window.ClinicBotConfig));
  if (/[?&]mode=standard\b/.test(location.search)) cfg.ai.enabled = false;
  cfg.instanceId = "direct-link";
  if (window.innerWidth <= 600) cfg.branding.square = true;
  ClinicChatbot.mount("#chat", cfg);
</script>
</body>
</html>
