  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <h1>Connect <span>4</span></h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-sound" type="button" aria-pressed="true">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="btn-theme" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.6-.8 1.6-1.6 0-.5-.2-.8-.4-1.1-.3-.3-.4-.6-.4-1.1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5C21 6.5 17 3 12 3zM6.5 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
        </button>
        <button class="icon-btn lang-btn" id="btn-lang" type="button">EN</button>
      </div>
    </header>
    <section class="scoreboard" aria-label="Score">
      <div class="player-card" id="card-human" data-player="1">
        <span class="chip p1" aria-hidden="true"></span>
        <span class="player-name" data-i18n="you"></span>
        <strong class="player-score" id="score-human">0</strong>
      </div>
      <div class="draw-card">
        <span data-i18n="draws"></span>
        <strong id="score-draws">0</strong>
      </div>
      <div class="player-card" id="card-ai" data-player="2">
        <span class="chip p2" aria-hidden="true"></span>
        <span class="player-name" data-i18n="computer"></span>
        <strong class="player-score" id="score-ai">0</strong>
      </div>
    </section>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <main class="board-wrap">
      <div class="board" id="board" dir="ltr">
        <div class="grid">
          <div class="discs" id="discs"></div>
          <div class="board-front" id="board-front" aria-hidden="true"></div>
          <svg class="win-line" id="win-line" viewBox="0 0 7 6" aria-hidden="true"><line/></svg>
          <div class="columns" id="columns"></div>
        </div>
      </div>
    </main>
    <section class="controls">
      <div class="control-group">
        <span class="control-label" data-i18n="difficulty"></span>
        <div class="segmented" id="seg-level" role="radiogroup">
          <button type="button" role="radio" data-value="easy" data-i18n="easy"></button>
          <button type="button" role="radio" data-value="medium" data-i18n="medium"></button>
          <button type="button" role="radio" data-value="hard" data-i18n="hard"></button>
        </div>
      </div>
      <div class="control-group">
        <span class="control-label" data-i18n="firstMove"></span>
        <div class="segmented" id="seg-first" role="radiogroup">
          <button type="button" role="radio" data-value="human" data-i18n="you"></button>
          <button type="button" role="radio" data-value="ai" data-i18n="computer"></button>
        </div>
      </div>
      <div class="buttons">
        <button class="btn btn-ghost" id="btn-undo" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 12h-2" transform="translate(0 -3)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="undo"></span>
        </button>
        <button class="btn btn-primary" id="btn-new" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="newGame"></span>
        </button>
      </div>
    </section>
    <p class="hint" data-i18n="hint"></p>
  </div>
